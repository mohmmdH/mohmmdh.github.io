<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mohammed Al-Hussain - Madre Janus</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --accent-color: #c49b66; /* Premium warm accent */
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Logo Styling */
        .company-logo {
            width: 120px;
            height: auto;
            margin-bottom: 24px;
            border-radius: 8px;
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
        }

        .title {
            font-size: 15px;
            color: var(--accent-color);
            font-weight: 500;
            margin: 0 0 4px 0;
        }

        .company {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            background-color: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-sizing: border-box;
            border: 1px solid #2a2a2a;
        }

        .btn:active {
            transform: scale(0.98);
            background-color: #222;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000000;
            border: none;
        }

        .btn-primary:active {
            background-color: #a37f50;
        }

        .icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-header">
            <!-- Replace 'logo.png' with your actual Madre Janus logo file -->
            <img src="logo.png" alt="Madre Janus Logo" class="company-logo" onerror="this.style.display='none'">
            
            <h1 class="name">Mohammed Al-Hussain</h1>
            <p class="title">Cybersecurity Solutions Associate</p>
            <p class="company">Madre Janus</p>
        </div>

        <div class="links-container">
            <!-- Save to Contacts -->
            <a href="contact.vcf" class="btn btn-primary">
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3H5C3.89 3 3 3.9 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM12 6C13.66 6 15 7.34 15 9C15 10.66 13.66 12 12 12C10.34 12 9 10.66 9 9C9 7.34 10.34 6 12 6ZM18 18H6V17.11C6 15.11 10 14 12 14C14 14 18 15.11 18 17.11V18Z"/>
                </svg>
                Save to Contacts
            </a>

            <!-- LinkedIn -->
            <a href="https://linkedin.com/in/yourprofile" class="btn">
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3A2 2 0 0 1 21 5V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H19M18.5 18.5V13.2A3.26 3.26 0 0 0 15.24 9.94C13.91 9.94 13 10.68 12.57 11.41V10.13H9.4V18.5H12.57V13.83C12.57 12.59 12.8 11.53 14 11.53C15.2 11.53 15.34 12.78 15.34 13.92V18.5H18.5M6.88 8.56A1.68 1.68 0 0 0 8.56 6.88C8.56 5.95 7.81 5.19 6.88 5.19A1.69 1.69 0 0 0 5.19 6.88C5.19 7.81 5.95 8.56 6.88 8.56M8.46 18.5H5.3V10.13H8.46V18.5Z"/>
                </svg>
                LinkedIn Profile
            </a>

            <!-- Email -->
            <a href="mailto:your.email@example.com" class="btn">
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 18H4V8L12 13L20 8V18ZM12 11L4 6H20L12 11Z"/>
                </svg>
                Send Email
            </a>
        </div>
    </div>

</body>
</html>
