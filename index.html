<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Al-Hussain - Contact</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #007bff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--card-bg);
            padding: 40px 20px;
            border-radius: 16px;
            max-width: 350px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .title {
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            box-sizing: border-box;
        }
        .btn-outline {
            background-color: transparent;
            border: 1px solid #444;
            color: #ddd;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="name">Mohammed Al-Hussain</div>
        <div class="title">Cybersecurity Solutions Associate @ Madre Janus</div>
        
        <a href="contact.vcf" class="btn">Save to Contacts</a>
        <a href="https://linkedin.com/in/yourprofile" class="btn btn-outline">LinkedIn</a>
    </div>
</body>
</html>
